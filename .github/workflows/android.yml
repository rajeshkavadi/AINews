name: Android CI

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Skip the action's default install of the obsolete `tools` package
          # (removed by Google; its absence fails the action). We install the
          # packages we actually need in the next step.
          packages: ""

      - name: Install required SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK (workflow artifact)
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Publishes the APK as an asset on a rolling "latest-debug" release, so it
      # has a stable, directly downloadable URL that needs no GitHub login
      # (this repo is public):
      #   https://github.com/rajeshkavadi/AINews/releases/download/latest-debug/app-debug.apk
      - name: Publish APK to rolling release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-debug
          name: Latest debug build
          body: "Auto-built debug APK from commit ${{ github.sha }}"
          files: app/build/outputs/apk/debug/app-debug.apk
